
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Research Bot | AI Research Assistant</title>

    <link rel="stylesheet" href="/static/style.css?v=5">
    <script src="/static/script.js?v=5" defer></script>
</head>

<body>

    <div class="app-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-brand">
                <div class="brand-icon">R</div>
                <span>Research Bot</span>
            </div>

            <button id="new-chat-button" class="new-chat-button" type="button">
                <span>＋</span>
                New Chat
            </button>

            <div class="sidebar-bottom">
                <span class="sidebar-caption">
                    AI Research Paper Assistant
                </span>
            </div>

        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="main-content">

            <!-- TOP BAR -->
            <header class="chat-header">
                <div class="header-title">
                    Research Bot
                    <span class="header-subtitle">
                        Research Paper Assistant
                    </span>
                </div>
            </header>

            <!-- CHAT CONVERSATION -->
            <section
                id="chat-container"
                class="chat-container"
                aria-label="Research Bot conversation"
            >

                <!-- WELCOME SCREEN -->
                <div id="welcome-screen" class="welcome-screen">

                    <div class="welcome-icon">R</div>

                    <h1>Welcome to Research Bot</h1>

                    <p>
                        Your AI-powered research companion.
                        Ask questions and explore knowledge from research papers.
                    </p>

                    <div class="suggestion-grid">

                        <button
                            class="suggestion-card"
                            type="button"
                            data-question="What is Retrieval-Augmented Generation?"
                        >
                            What is Retrieval-Augmented Generation?
                        </button>

                        <button
                            class="suggestion-card"
                            type="button"
                            data-question="Explain multi-head attention in the Transformer."
                        >
                            Explain multi-head attention
                        </button>

                        <button
                            class="suggestion-card"
                            type="button"
                            data-question="Compare RAG-Sequence and RAG-Token models."
                        >
                            Compare RAG-Sequence and RAG-Token
                        </button>

                    </div>

                </div>

                <!-- MESSAGES WILL BE ADDED HERE BY JAVASCRIPT -->
                <div
                    id="messages"
                    class="messages"
                    role="log"
                    aria-live="polite"
                    aria-relevant="additions"
                ></div>

            </section>

            <!-- MESSAGE INPUT -->
            <div class="composer-wrapper">

                <form id="chat-form" class="chat-form">

                    <label for="research-question" class="sr-only">
                        Ask Research Bot
                    </label>

                    <textarea
                        id="research-question"
                        rows="1"
                        maxlength="2000"
                        placeholder="Message Research Bot..."
                        required
                    ></textarea>

                    <button
                        type="submit"
                        id="ask-button"
                        class="send-button"
                        aria-label="Send message"
                        title="Send message"
                    >
                        ↑
                    </button>

                </form>

                <p
                    id="chat-message"
                    class="chat-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <p class="composer-note">
                    Research Bot generates answers using your research-paper knowledge base.
                </p>

            </div>

        </main>

    </div>

</body>
</html>
